const map = L.map('map', {
  zoomControl: true,
  attributionControl: false
});

// Dark tile layer
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

const colors = [
  '#1a3a6e','#1e4080','#243d7a','#1c3870',
  '#284285','#1f3d7c','#224080','#253d78',
  '#1d3a74','#214080','#263e7d','#1b3870',
  '#204080','#253b7a','#1e3c78','#224285'
];

let selectedLayer = null;

function style(feature, idx) {
  return {
    fillColor: colors[idx % colors.length],
    fillOpacity: 0.72,
    color: '#4a7ad4',
    weight: 1.5,
    opacity: 0.9
  };
}

function highlightStyle() {
  return {
    fillColor: '#2e5aa0',
    fillOpacity: 0.9,
    color: '#c8aa64',
    weight: 2.5,
    opacity: 1
  };
}

const layers = [];
GEOJSON.features.forEach((feature, idx) => {
  const layer = L.geoJSON(feature, {
    style: () => style(feature, idx)
  }).addTo(map);

  layer.on('mouseover', function(e) {
    if (selectedLayer !== layer) {
      layer.setStyle({ fillOpacity: 0.9, weight: 2, color: '#7aa8e0' });
    }
  });

  layer.on('mouseout', function(e) {
    if (selectedLayer !== layer) {
      layer.setStyle(style(feature, idx));
    }
  });

  layer.on('click', function(e) {
    if (selectedLayer && selectedLayer !== layer) {
      const prevIdx = layers.indexOf(selectedLayer);
      selectedLayer.setStyle(style(GEOJSON.features[prevIdx], prevIdx));
    }
    layer.setStyle(highlightStyle());
    selectedLayer = layer;
    
    const panel = document.getElementById('infoPanel');
    document.getElementById('deptName').textContent = feature.properties.name;
    document.getElementById('deptFull').textContent = feature.properties.fullname;
    panel.classList.add('active');
    L.DomEvent.stopPropagation(e);
  });

  layers.push(layer);
});

map.on('click', function() {
  if (selectedLayer) {
    const idx = layers.indexOf(selectedLayer);
    selectedLayer.setStyle(style(GEOJSON.features[idx], idx));
    selectedLayer = null;
  }
  document.getElementById('infoPanel').classList.remove('active');
});

// Fit map to Jujuy bounds
const group = L.geoJSON(GEOJSON);
map.fitBounds(group.getBounds(), { padding: [20, 20] });

// Add department name labels
GEOJSON.features.forEach(feature => {
  const layer = L.geoJSON(feature);
  const bounds = layer.getBounds();
  const center = bounds.getCenter();
  
  const name = feature.properties.name;
  const label = L.divIcon({
    className: 'dept-label',
    html: name,
    iconSize: null,
    iconAnchor: null
  });
  
  L.marker([center.lat, center.lng], {
    icon: label,
    interactive: false,
    zIndexOffset: 1000
  }).addTo(map);
});
</script>
